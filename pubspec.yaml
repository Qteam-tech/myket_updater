name: myket_updater
description: A Flutter plugin for checking app updates on Myket (Iranian app store). Provides a simple API to check for updates and show an update dialog to users.
version: 1.0.2
repository: https://github.com/Qteam-tech/myket_updater

environment:
  sdk: ^3.0.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.myket_updater
        pluginClass: MyketUpdaterPlugin
